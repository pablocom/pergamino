name: Server CI

on:
  push:

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        working-directory: server
        run: mix deps.get

      - name: Compile code
        working-directory: server
        run: mix compile --warnings-as-errors

      - name: Debug Environment
        working-directory: server
        env:
          MIX_ENV: test
        run: |
          mix run -e '
            IO.puts("\n=== DEBUG INFO ===")
            redis_config = Application.get_env(:pergamino, :redis)
            IO.inspect(redis_config, label: "Redis Config")
            
            email_config = Application.get_env(:pergamino, Pergamino.Infrastructure.Messaging.EmailSender)
            IO.inspect(email_config, label: "Email Config")
            
            redis_url = redis_config[:url]
            IO.puts("Connecting to Redis at #{redis_url}...")
            
            case Redix.start_link(redis_url) do
              {:ok, conn} -> 
                IO.inspect(Redix.command(conn, ["PING"]), label: "Redis PING")
                Redix.stop(conn)
              error -> 
                IO.inspect(error, label: "Redis Connection Error")
            end
            IO.puts("=== END DEBUG ===\n")
          '

      - name: Run unit tests
        working-directory: server
        run: mix test.unit

      - name: Run component tests
        working-directory: server
        run: mix test.component

      - name: Run integration tests
        working-directory: server
        run: mix test.integration
